name: Build And Deploy API To Container Apps

on:
  # Run this workflow only when code is pushed to the docker branch
  push:
    branches:
      - docker

permissions:
  contents: read

concurrency:
  group: containerapp-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      # Azure resource configuration
      RESOURCE_GROUP: rg-learning-dev
      CONTAINER_APP_NAME: ca-webapi-learning
      ACR_NAME: acrlearninggrzegorz123
      ACR_LOGIN_SERVER: acrlearninggrzegorz123.azurecr.io

      # Container image configuration
      IMAGE_NAME: webapi-learning
      IMAGE_TAG: ${{ github.sha }}

    steps:
      # 1) Checkout repository contents so Docker can build from source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Authenticate to Azure using service principal JSON from AZURE_CREDENTIALS
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3) Authenticate Docker client against Azure Container Registry via Azure CLI
      - name: Azure Container Registry login
        run: az acr login --name "$ACR_NAME"

      # 4) Build Docker image from Dockerfile in repository root and push to ACR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # 5) Deploy the new image to Azure Container Apps
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
