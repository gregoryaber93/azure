name: Build And Deploy API To Container Apps

on:
push:
branches:
- docker

permissions:
contents: read

concurrency:
group: containerapp-deploy-${{ github.ref }}
cancel-in-progress: true

jobs:
build-and-deploy:
runs-on: ubuntu-latest

```
env:
  RESOURCE_GROUP: rg-learning-dev
  CONTAINER_APP_NAME: ca-webapi-learning
  ACR_NAME: acrlearninggrzegorz123
  ACR_LOGIN_SERVER: acrlearninggrzegorz123.azurecr.io

  IMAGE_NAME: webapi-learning
  IMAGE_TAG: ${{ github.sha }}

steps:
  # 1. Checkout repo
  - name: Checkout code
    uses: actions/checkout@v4

  # 2. Login do Azure (Service Principal)
  - name: Azure login
    uses: azure/login@v2
    with:
      creds: ${{ secrets.AZURE_CREDENTIALS }}

  # 3. Login do ACR (Docker)
  - name: Login to ACR for Docker
    uses: docker/login-action@v3
    with:
      registry: ${{ env.ACR_LOGIN_SERVER }}
      username: ${{ secrets.ACR_USERNAME }}
      password: ${{ secrets.ACR_PASSWORD }}

  # 4. Build + Push Docker image
  - name: Build and push Docker image
    uses: docker/build-push-action@v6
    with:
      context: .
      file: ./Dockerfile
      push: true
      tags: |
        ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
      cache-from: type=gha
      cache-to: type=gha,mode=max

  # 5. Deploy do Azure Container Apps
  - name: Deploy to Azure Container App
    run: |
      set -e
      az containerapp update \
        --name "$CONTAINER_APP_NAME" \
        --resource-group "$RESOURCE_GROUP" \
        --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
        --revision-suffix "$IMAGE_TAG"
```
