name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'MyApi/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MyApi/MyApi.csproj

      - name: Build
        run: dotnet build MyApi/MyApi.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish MyApi/MyApi.csproj --configuration Release --no-build --output ./publish-api

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: webapp-learning-1
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish-api
